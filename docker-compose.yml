services:
  postgres:
    image: postgres:16
    container_name: timesheets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timesheets_db
      POSTGRES_USER: timesheets_user
      POSTGRES_PASSWORD: timesheets_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
